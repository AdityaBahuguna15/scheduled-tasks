name: Test Setup

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured
        env:
          MY_PHONE: ${{ secrets.MY_PHONE }}
          TWILIO_PHONE: ${{ secrets.TWILIO_PHONE }}
          API_KEY_WEATHER: ${{ secrets.API_KEY_WEATHER }}
          ACC_SID: ${{ secrets.ACC_SID }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

        run: |
          if [ -z "$MY_PHONE" ]; then
            echo "MY_PHONE secret is not set!"
            exit 1
          else
            echo "MY_PHONE is configured"
          fi

          if [ -z "$TWILIO_PHONE" ]; then
            echo "TWILIO_PHONE secret is not set!"
            exit 1
          else
            echo "TWILIO_PHONE is configured"
          fi

          if [ -z "$API_KEY_WEATHER" ]; then
            echo "API_KEY_WEATHER secret is not set!"
            exit 1
          else
            echo "API_KEY_WEATHER is configured"
          fi

          if [ -z "$ACC_SID" ]; then
            echo "ACC_SID secret is not set!"
            exit 1
          else
            echo "ACC_SID is configured"
          fi

          if [ -z "$AUTH_TOKEN" ]; then
            echo "AUTH_TOKEN secret is not set!"
            exit 1
          else
            echo "AUTH_TOKEN is configured"
          fi

          echo ""
          echo "All secrets are configured!"

      - name: Check required files exist
        run: |
          echo "Checking for required files..."

          if [ -f "main.py" ]; then
            echo "main.py found"
          else
            echo "main.py not found!"
            exit 1
          fi

          if [ -f "requirements.txt" ]; then
            echo "requirements.txt found"
          else
            echo "requirements.txt not found!"
            exit 1
          fi

          if [ -f "birthdays.csv" ]; then
            echo "birthdays.csv found"
          else
            echo "birthdays.csv not found!"
            exit 1
          fi

          echo ""
          echo "All required files found!"

      - name: Test Python syntax
        run: python -m py_compile main.py && echo "Python syntax OK"

      - name: Success
        run: |
          echo ""
          echo "========================================"
          echo "  All checks passed!"
          echo "  Your setup is ready to go."
          echo "========================================"
